[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rltune-boomeramg"
version = "0.1.0"
description = "Online BoomerAMG setup tuning and cycle-level solve control"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gymnasium==1.2.3",
    "matplotlib==3.10.9",
    "mpi4py==4.1.2",
    "numpy==2.2.6",
    "sb3-contrib==2.7.1",
    "scipy==1.15.3",
    "stable-baselines3==2.7.1",
    "torch==2.9.1",
]

[project.urls]
Repository = "https://github.com/EriseHe/RLTune-BoomerAMG"

[tool.setuptools.packages.find]
include = ["setup*", "solve*", "problems*", "experiments*", "hypre", "hypre.bindings*"]
exclude = ["*.archive*", "*.reproduction*"]
namespaces = true

[tool.ruff]
target-version = "py310"
extend-exclude = ["hypre/source", "experiments/archive", "docs/archive", "tmp", "results"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
